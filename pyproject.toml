[project]
name = "marketplace-sales-tracker"
version = "0.1.0"
description = "Multi-channel sales tracker for 3D assets (Gumroad, Fab, CGTrader, Cosmos)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.27",
    "playwright>=1.65.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.67.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
